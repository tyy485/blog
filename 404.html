<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0">
<title>404 · 页面找不到了</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#f4f5f7;
    font-family:"Microsoft YaHei",PingFang SC,sans‑serif;
    display:flex;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.box{
    background:#fff;
    padding:48px 36px;
    border-radius:14px;
    text-align:center;
    border:1px solid #e8e8e8;
    max-width:440px;
    width:100%;
}
h1{
    font-size:72px;
    color:#1a73e8;
    line-height:1;
    margin-bottom:16px;
}
.title{
    font-size:22px;
    color:#1e232b;
    margin-bottom:12px;
}
.desc{
    font-size:15px;
    color:#777;
    margin-bottom:32px;
    line-height:1.7;
}
.back-btn{
    display:inline-block;
    padding:11px 28px;
    background:#1e232b;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:15px;
    transition:background .18s;
}
.back-btn:hover{
    background:#39414d;
}
</style>
</head>
<body>
<div class="box">
    <h1>404</h1>
    <div class="title">页面走丢啦</div>
    <div class="desc">
        你访问的地址不存在，可能链接写错、页面已经移动或者被删除。
    </div>
    <a class="back-btn" href="./index.html">返回主页</a>
</div>
</body>
</html>
